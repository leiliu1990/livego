<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <title>LiveGo</title>
  <link rel="stylesheet" href="style.css?v=30">
</head>
<body>

  <!-- SCREEN 1: Camera + corner setup -->
  <div id="screen-setup" class="screen active">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <!-- Lens / camera picker (0.5×, 1×, …) -->
    <div id="lens-bar" style="display:none">
      <label>Lens <select id="lens-select"></select></label>
    </div>

    <!-- Magnifier: tap near a crossing, then nudge with arrows to the exact spot -->
    <div id="zoom-overlay">
      <div id="zoom-hint">Nudge to the exact crossing, then Confirm</div>
      <canvas id="zoom-canvas"></canvas>
      <div id="zoom-pad">
        <button id="zoom-up" class="zoom-arrow" aria-label="up">▲</button>
        <div class="zoom-pad-mid">
          <button id="zoom-left" class="zoom-arrow" aria-label="left">◀</button>
          <button id="zoom-confirm" class="btn primary">Confirm</button>
          <button id="zoom-right" class="zoom-arrow" aria-label="right">▶</button>
        </div>
        <button id="zoom-down" class="zoom-arrow" aria-label="down">▼</button>
      </div>
      <button id="zoom-cancel" class="btn ghost">Cancel</button>
    </div>

    <div id="setup-ui">
      <div id="instructions">Tap near each of the 4 outer grid crossings — a magnified view opens; nudge with the arrows to the exact spot, then Confirm<br><span id="corner-count">0 / 4 corners set</span></div>
      <div id="setup-buttons">
        <button id="btn-undo-corner" class="btn secondary" disabled>Undo</button>
        <button id="btn-start" class="btn primary" disabled>Start Game</button>
      </div>
      <button id="btn-reset-corners" class="btn ghost">Reset Corners</button>
    </div>

    <!-- Game info form (shown before Start) -->
    <div id="game-info-form" class="hidden">
      <h2>Game Info</h2>
      <label>Black player <input id="input-black" type="text" placeholder="Black"></label>
      <label>White player <input id="input-white" type="text" placeholder="White"></label>
      <label>Komi <input id="input-komi" type="number" value="6.5" step="0.5"></label>
      <div class="form-buttons">
        <button id="btn-cancel-form" class="btn secondary">Back</button>
        <button id="btn-confirm-start" class="btn primary">Begin</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: Recording -->
  <div id="screen-record" class="screen">
    <video id="video2" autoplay playsinline muted></video>
    <canvas id="board-canvas"></canvas>

    <!-- Live debug HUD (tap to toggle) -->
    <div id="debug-hud" class="hidden"></div>

    <div id="record-ui">
      <div id="status-bar">
        <span id="move-count">Move 0</span>
        <span id="last-move"></span>
        <span id="detection-status">●</span>
      </div>
      <div id="record-buttons">
        <button id="btn-undo-move" class="btn secondary">Undo Move</button>
        <button id="btn-fix" class="btn secondary">修正 Fix</button>
        <button id="btn-recalibrate" class="btn secondary">Recalibrate</button>
        <button id="btn-export" class="btn primary">Export SGF</button>
      </div>
      <div id="record-buttons">
        <button id="btn-live" class="btn secondary">Go Live</button>
        <button id="btn-debug-toggle" class="btn ghost">Debug HUD</button>
        <button id="btn-debug-export" class="btn ghost">Export Debug Log</button>
      </div>
      <div id="live-panel" class="hidden">
        <span id="live-status">● LIVE</span>
        <span id="live-link"></span>
        <button id="btn-live-copy" class="btn ghost">Copy viewer link</button>
      </div>
    </div>

    <!-- Manual fix: edit the position to match the physical board, then resume -->
    <div id="fix-overlay" class="hidden">
      <div id="fix-hint">点交叉点循环 空→黑→白→空，改到和实体棋盘一致</div>
      <canvas id="fix-canvas"></canvas>
      <div id="fix-controls">
        <button id="btn-fix-turn" class="btn secondary">下一手：黑</button>
        <button id="btn-fix-cancel" class="btn ghost">取消</button>
        <button id="btn-fix-apply" class="btn primary">应用并继续</button>
      </div>
    </div>
  </div>

  <script src="opencv.js"></script>
  <script src="live.js?v=30"></script>
  <script src="corners.js?v=30"></script>
  <script src="detector.js?v=30"></script>
  <script src="sgf.js?v=30"></script>
  <script src="app.js?v=30"></script>
</body>
</html>
