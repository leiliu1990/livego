<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>LiveGo — Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root { --bg:#1c1c1e; --panel:#2c2c2e; --line:#3a3a3c; --fg:#e5e5ea; --dim:#8e8e93; --accent:#30d158; }
    html, body { height: 100%; }
    * { touch-action: manipulation; }  /* kill double-tap-to-zoom */
    body {
      background: var(--bg); color: var(--fg);
      font: 15px/1.4 -apple-system, system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      width: 100%; max-width: 640px;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
    }
    header h1 { font-size: 17px; font-weight: 600; }
    #live-badge {
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--dim);
      padding: 4px 10px; border-radius: 20px; background: var(--panel);
    }
    #live-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    #live-badge.live { color: var(--accent); }
    #live-badge.live .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    #players {
      width: 100%; max-width: 640px;
      display: flex; justify-content: space-between; gap: 12px;
      padding: 0 16px 8px;
      font-size: 13px; color: var(--dim);
    }
    #players b { color: var(--fg); font-weight: 600; }
    .pdot { display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:-1px; margin-right:5px; border:1px solid #666; }
    .pdot.b { background:#111; } .pdot.w { background:#fafafa; }

    #board-wrap { width: 100%; max-width: 640px; padding: 0 12px; }
    #board { width: 100%; height: auto; display: block; border-radius: 8px; }

    #status { max-width: 640px; width: 100%; text-align: center; padding: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
    #status b { color: var(--fg); }

    #controls {
      width: 100%; max-width: 640px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      padding: 4px 16px 20px;
    }
    #controls.hidden, #try-bar.hidden, #try-controls.hidden { display: none; }
    #try-bar { width: 100%; max-width: 640px; padding: 0 16px 12px; }
    #try-bar button { width: 100%; font-size: 16px; padding: 13px 0; }
    #try-controls {
      width: 100%; max-width: 640px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 4px 16px 20px;
    }
    #try-controls button { font-size: 16px; }
    button {
      appearance: none; border: none; cursor: pointer;
      background: var(--panel); color: var(--fg);
      font-size: 20px; font-weight: 600;
      padding: 16px 0; border-radius: 12px;
      transition: background .12s, transform .06s;
    }
    button:active { transform: scale(0.96); background: #3a3a3c; }
    button:disabled { opacity: 0.32; cursor: default; }
    button.play { background: var(--accent); color: #000; }
    .hint { max-width: 640px; width: 100%; text-align: center; color: var(--dim); font-size: 12px; padding: 0 16px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>LiveGo</h1>
    <span id="live-badge"><span class="dot"></span><span id="live-text">offline</span></span>
  </header>

  <div id="players">
    <span><span class="pdot b"></span><b id="p-black">Black</b> <span id="cap-black"></span></span>
    <span><span id="cap-white"></span><b id="p-white">White</b><span class="pdot w"></span></span>
  </div>

  <div id="board-wrap"><canvas id="board"></canvas></div>

  <div id="status"><b id="move-label">Move 0</b> / <span id="move-total">0</span> <span id="last-coord"></span></div>

  <div id="controls">
    <button id="btn-begin" title="Start">⏮</button>
    <button id="btn-prev"  title="Previous">◀</button>
    <button id="btn-next"  title="Next">▶</button>
    <button id="btn-end" class="play" title="Latest / Live">⏭</button>
  </div>
  <div id="try-bar">
    <button id="btn-try">试下 · Try variation</button>
  </div>
  <div id="try-controls" class="hidden">
    <button id="btn-try-undo" title="Undo">悔一手</button>
    <button id="btn-try-end" class="play" title="End variation">结束试下</button>
  </div>
  <div class="hint">Arrow keys ← → to step · Space for latest. Auto-plays new moves when you're at the latest.</div>

<script src="live.js?v=28"></script>
<script>
// ── Config ──────────────────────────────────────────────────────────────────────
const BOARD_SIZE = 19;
const HOSHI = [3, 9, 15];
const POLL_MS = 3000;          // how often to check for new moves
const AUTOPLAY_MS = 900;       // delay between auto-played new moves

// A built-in demo game (IMG_2534). Replace by ?game=<url-to-json> for a real feed.
// Move format: { c: 1|2 (black|white), y: row, x: col }.
const DEMO_GAME = {
  info: { black: 'Black', white: 'White', size: 19 },
  moves: [
    {c:1,y:3,x:3},  {c:2,y:15,x:15}, {c:1,y:3,x:15}, {c:2,y:15,x:3},
    {c:1,y:3,x:9},  {c:2,y:5,x:16},  {c:1,y:5,x:15}, {c:2,y:6,x:15},
    {c:1,y:5,x:14}, {c:2,y:4,x:17},  {c:1,y:2,x:16}, {c:2,y:6,x:14},
  ],
};

// ── State ───────────────────────────────────────────────────────────────────────
let game = { info: {}, moves: [] };
let index = 0;            // number of moves shown (0 = empty board)
let autoplayTimer = null;
let lastFetchOk = 0;

// Try-variation ("试下") state: a scratch board branched off the current position.
let tryMode = false;
let tryBoard = null;      // scratch board we mutate while trying moves
let tryMoves = [];        // [{y,x,c}] in play order; the label is the index+1
let tryStartColor = 1;    // whose turn it is at the branch point
let tryCapB = 0, tryCapW = 0; // stones captured during the variation
let tryWasAtEnd = false;  // were we following the live end when we branched?

// ── Go engine: replay moves with capture rules ──────────────────────────────────
function emptyBoard() {
  return Array.from({ length: BOARD_SIZE }, () => new Array(BOARD_SIZE).fill(0));
}
function neighbors(y, x) {
  const out = [];
  if (y > 0) out.push([y - 1, x]);
  if (y < BOARD_SIZE - 1) out.push([y + 1, x]);
  if (x > 0) out.push([y, x - 1]);
  if (x < BOARD_SIZE - 1) out.push([y, x + 1]);
  return out;
}
// Flood-fill a group; return {stones:[[y,x]...], libs:count}.
function groupInfo(board, y, x) {
  const color = board[y][x];
  const seen = new Set(), stones = [], libSet = new Set();
  const stack = [[y, x]]; seen.add(y * BOARD_SIZE + x);
  while (stack.length) {
    const [cy, cx] = stack.pop();
    stones.push([cy, cx]);
    for (const [ny, nx] of neighbors(cy, cx)) {
      const v = board[ny][nx];
      if (v === 0) libSet.add(ny * BOARD_SIZE + nx);
      else if (v === color && !seen.has(ny * BOARD_SIZE + nx)) {
        seen.add(ny * BOARD_SIZE + nx); stack.push([ny, nx]);
      }
    }
  }
  return { stones, libs: libSet.size };
}
// Apply one move; remove captured opponent groups. Returns captured [[y,x]...].
function applyMove(board, color, y, x) {
  board[y][x] = color;
  const opp = color === 1 ? 2 : 1;
  const captured = [];
  for (const [ny, nx] of neighbors(y, x)) {
    if (board[ny][nx] === opp) {
      const g = groupInfo(board, ny, nx);
      if (g.libs === 0) for (const [gy, gx] of g.stones) { board[gy][gx] = 0; captured.push([gy, gx]); }
    }
  }
  return captured;
}
// Board state after `n` moves, plus capture tally and the last move's coords.
function stateAt(n) {
  const board = emptyBoard();
  let capB = 0, capW = 0, last = null;
  for (let i = 0; i < n && i < game.moves.length; i++) {
    const m = game.moves[i];
    const cap = applyMove(board, m.c, m.y, m.x);
    if (cap.length) { if (m.c === 1) capB += cap.length; else capW += cap.length; }
    last = m;
  }
  return { board, capB, capW, last };
}

// ── Rendering ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

let boardPx = 0;
function sizeCanvas() {
  // Base the size on the viewport directly so we don't depend on layout timing.
  const avail = Math.min(window.innerWidth, 640) - 24; // 12px padding each side
  const size = Math.max(200, Math.floor(avail));
  boardPx = size;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  render();
}

function render() {
  const S = boardPx;
  if (!S) return; // not sized yet
  const margin = S * 0.045;
  const grid = S - 2 * margin;
  const step = grid / (BOARD_SIZE - 1);
  let board, capB, capW, last;
  if (tryMode) {
    board = tryBoard; capB = tryCapB; capW = tryCapW;
    last = tryMoves.length ? tryMoves[tryMoves.length - 1] : null;
  } else {
    ({ board, capB, capW, last } = stateAt(index));
  }

  // Wood
  ctx.fillStyle = '#e3b96b';
  roundRect(0, 0, S, S, 8); ctx.fill();

  // Lines
  ctx.strokeStyle = 'rgba(60,40,10,0.85)';
  ctx.lineWidth = Math.max(1, step * 0.03);
  ctx.beginPath();
  for (let i = 0; i < BOARD_SIZE; i++) {
    const p = margin + i * step;
    ctx.moveTo(margin, p); ctx.lineTo(margin + grid, p);
    ctx.moveTo(p, margin); ctx.lineTo(p, margin + grid);
  }
  ctx.stroke();

  // Star points
  ctx.fillStyle = 'rgba(60,40,10,0.9)';
  for (const r of HOSHI) for (const c of HOSHI) {
    ctx.beginPath();
    ctx.arc(margin + c * step, margin + r * step, Math.max(2, step * 0.09), 0, 7);
    ctx.fill();
  }

  // Stones
  const sr = step * 0.47;
  for (let y = 0; y < BOARD_SIZE; y++) for (let x = 0; x < BOARD_SIZE; x++) {
    const v = board[y][x];
    if (!v) continue;
    const px = margin + x * step, py = margin + y * step;
    const g = ctx.createRadialGradient(px - sr*0.35, py - sr*0.35, sr*0.1, px, py, sr);
    if (v === 1) { g.addColorStop(0,'#666'); g.addColorStop(1,'#0a0a0a'); }
    else         { g.addColorStop(0,'#fff'); g.addColorStop(1,'#cfcfcf'); }
    ctx.beginPath(); ctx.arc(px, py, sr, 0, 7); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = v === 1 ? '#000' : '#aaa'; ctx.lineWidth = 0.5; ctx.stroke();
  }

  // Try-variation stones get sequence numbers (1,2,3…) instead of a ring marker.
  if (tryMode) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(step * 0.52)}px -apple-system, system-ui, sans-serif`;
    tryMoves.forEach((m, i) => {
      if (board[m.y][m.x] !== m.c) return;     // this try stone was captured
      const px = margin + m.x * step, py = margin + m.y * step;
      ctx.fillStyle = m.c === 1 ? '#fff' : '#111';
      ctx.fillText(String(i + 1), px, py);
    });
  } else if (last) {
    // Last-move marker (normal replay)
    const px = margin + last.x * step, py = margin + last.y * step;
    ctx.beginPath(); ctx.arc(px, py, sr * 0.35, 0, 7);
    ctx.strokeStyle = last.c === 1 ? '#fff' : '#d00'; ctx.lineWidth = Math.max(1.5, step*0.05); ctx.stroke();
  }

  // Labels
  document.getElementById('move-label').textContent = tryMode ? '试下' : 'Move ' + index;
  document.getElementById('move-total').textContent = tryMode ? tryMoves.length : game.moves.length;
  document.getElementById('last-coord').textContent = last ? '· ' + coordLabel(last) : '';
  document.getElementById('cap-black').textContent = capB ? `+${capB}` : '';
  document.getElementById('cap-white').textContent = capW ? `+${capW}` : '';
  updateButtons();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
const COLS = 'ABCDEFGHJKLMNOPQRST'; // Go skips 'I'
function coordLabel(m) {
  return (m.c === 1 ? 'B ' : 'W ') + COLS[m.x] + (BOARD_SIZE - m.y);
}

// ── Navigation ──────────────────────────────────────────────────────────────────
function isAtEnd() { return index >= game.moves.length; }
function goto(i) {
  index = Math.max(0, Math.min(game.moves.length, i));
  stopAutoplay();
  render();
}
function updateButtons() {
  document.getElementById('btn-begin').disabled = index === 0;
  document.getElementById('btn-prev').disabled  = index === 0;
  document.getElementById('btn-next').disabled  = isAtEnd();
  document.getElementById('btn-end').disabled   = isAtEnd() && !autoplayTimer;
  document.getElementById('btn-try-undo').disabled = tryMoves.length === 0;
}
document.getElementById('btn-begin').onclick = () => goto(0);
document.getElementById('btn-prev').onclick  = () => goto(index - 1);
document.getElementById('btn-next').onclick  = () => goto(index + 1);
document.getElementById('btn-end').onclick   = () => goto(game.moves.length);
window.addEventListener('keydown', e => {
  if (tryMode) {                              // in a variation, nav keys are disabled
    if (e.key === 'Backspace') { e.preventDefault(); tryUndo(); }
    else if (e.key === 'Escape') exitTry();
    return;
  }
  if (e.key === 'ArrowLeft') goto(index - 1);
  else if (e.key === 'ArrowRight') goto(index + 1);
  else if (e.key === 'Home') goto(0);
  else if (e.key === 'End' || e.key === ' ') goto(game.moves.length);
});

// ── Try variation ("试下") ────────────────────────────────────────────────────────
// Branch a scratch board off the current position; place alternating stones with
// full capture + suicide rules; each stone is labelled by its play order. Ending
// the variation discards it and returns to the live game (jumped to the latest).
function enterTry() {
  stopAutoplay();
  tryWasAtEnd = isAtEnd();
  const { board, last } = stateAt(index);
  tryBoard = board.map(r => r.slice());
  tryStartColor = last ? (last.c === 1 ? 2 : 1) : 1; // opposite of last real move
  tryMoves = [];
  tryCapB = tryCapW = 0;
  tryMode = true;
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('try-bar').classList.add('hidden');
  document.getElementById('try-controls').classList.remove('hidden');
  render();
}
function exitTry() {
  tryMode = false;
  tryBoard = null; tryMoves = [];
  document.getElementById('controls').classList.remove('hidden');
  document.getElementById('try-bar').classList.remove('hidden');
  document.getElementById('try-controls').classList.add('hidden');
  // If we were following the live end, jump to the latest (new moves may have
  // arrived while trying); otherwise stay on the position we branched from.
  if (tryWasAtEnd) index = game.moves.length;
  render();
}
function tryNextColor() {
  return (tryMoves.length % 2 === 0) ? tryStartColor : (tryStartColor === 1 ? 2 : 1);
}
// Place a stone with Go rules on tryBoard. Returns true if legal (and applied).
function tryPlace(y, x) {
  if (tryBoard[y][x] !== 0) return false;    // occupied
  const color = tryNextColor();
  const opp = color === 1 ? 2 : 1;
  tryBoard[y][x] = color;
  const captured = [];
  for (const [ny, nx] of neighbors(y, x)) {
    if (tryBoard[ny][nx] === opp) {
      const g = groupInfo(tryBoard, ny, nx);
      if (g.libs === 0) for (const [gy, gx] of g.stones) { tryBoard[gy][gx] = 0; captured.push([gy, gx]); }
    }
  }
  // Suicide: no captures and the placed group has no liberties → illegal, revert.
  if (captured.length === 0 && groupInfo(tryBoard, y, x).libs === 0) {
    tryBoard[y][x] = 0;
    return false;
  }
  if (captured.length) { if (color === 1) tryCapB += captured.length; else tryCapW += captured.length; }
  tryMoves.push({ y, x, c: color });
  render();
  return true;
}
function tryUndo() {
  if (!tryMoves.length) return;
  const { board } = stateAt(index);          // rebuild from the branch point
  tryBoard = board.map(r => r.slice());
  tryCapB = tryCapW = 0;
  tryMoves.pop();
  for (const m of tryMoves) {
    const cap = applyMove(tryBoard, m.c, m.y, m.x);
    if (cap.length) { if (m.c === 1) tryCapB += cap.length; else tryCapW += cap.length; }
  }
  render();
}

// Map a tap/click on the board canvas to the nearest intersection.
function eventToPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX ?? (e.changedTouches && e.changedTouches[0].clientX)) - rect.left;
  const cy = (e.clientY ?? (e.changedTouches && e.changedTouches[0].clientY)) - rect.top;
  const S = rect.width;                       // css px; board is square
  const margin = S * 0.045, grid = S - 2 * margin, step = grid / (BOARD_SIZE - 1);
  const x = Math.round((cx - margin) / step);
  const y = Math.round((cy - margin) / step);
  if (x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return null;
  return { x, y };
}
canvas.addEventListener('click', (e) => {
  if (!tryMode) return;
  const p = eventToPoint(e);
  if (p) tryPlace(p.y, p.x);
});
document.getElementById('btn-try').onclick      = enterTry;
document.getElementById('btn-try-end').onclick  = exitTry;
document.getElementById('btn-try-undo').onclick = tryUndo;

// ── Autoplay of newly-arrived moves ─────────────────────────────────────────────
function stopAutoplay() { if (autoplayTimer) { clearTimeout(autoplayTimer); autoplayTimer = null; } }
function autoplayTo(target) {
  stopAutoplay();
  const step = () => {
    if (index >= target) { autoplayTimer = null; render(); return; }
    index++;
    render();
    autoplayTimer = setTimeout(step, AUTOPLAY_MS);
  };
  step();
}

// ── Data source ─────────────────────────────────────────────────────────────────
// ?id=<gameId>   → live Firebase feed (via live.js)
// ?game=<url>    → an explicit JSON URL
// neither        → the built-in demo game
async function fetchGame() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (id) {
    const g = await liveFetch(id);      // from live.js
    return g || { info: {}, moves: [] }; // null = game not created yet
  }
  const url = params.get('game');
  if (!url) return DEMO_GAME;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

let loadedOnce = false;
function applyGame(next) {
  const wasAtEnd = isAtEnd();
  const prevLen = game.moves.length;
  game = next || { info: {}, moves: [] };
  document.getElementById('p-black').textContent = game.info?.black || 'Black';
  document.getElementById('p-white').textContent = game.info?.white || 'White';

  // Don't disturb an in-progress variation; the new moves are stored in `game`
  // and take effect (jump to latest) when the user ends the try-out.
  if (tryMode) return;

  if (!loadedOnce) {                          // first load → jump straight to the latest position
    loadedOnce = true;
    index = game.moves.length;
    render();
    return;
  }
  if (game.moves.length < prevLen) { index = Math.min(index, game.moves.length); render(); return; } // reset/rewind
  if (wasAtEnd && game.moves.length > prevLen) autoplayTo(game.moves.length); // play new moves
  else render();
}

async function poll() {
  try {
    const g = await fetchGame();
    lastFetchOk = Date.now();
    setLive(true);
    applyGame(g);
  } catch (e) {
    setLive(false);
    console.warn('poll failed:', e.message);
  }
  setTimeout(poll, POLL_MS);
}
function setLive(ok) {
  const b = document.getElementById('live-badge');
  const t = document.getElementById('live-text');
  const params = new URLSearchParams(location.search);
  const usingFeed = params.has('game') || params.has('id');
  if (!usingFeed) { b.classList.remove('live'); t.textContent = 'demo'; return; }
  b.classList.toggle('live', ok);
  t.textContent = ok ? 'LIVE' : 'reconnecting…';
}

// Fallback for iOS Safari, which can ignore user-scalable=no: on the board only,
// swallow a second tap within 300 ms so a quick double-tap doesn't zoom. Scoped
// to the board (which has no tap action) so the nav buttons still take fast taps.
(() => {
  const boardEl = document.getElementById('board');
  if (!boardEl) return;
  let lastTap = 0;
  boardEl.addEventListener('touchend', (e) => {
    if (tryMode) return;                      // in a variation every tap places a stone
    const now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });
})();

// ── Boot ─────────────────────────────────────────────────────────────────────────
window.addEventListener('resize', sizeCanvas);
window.addEventListener('load', sizeCanvas);          // re-size once layout is final
sizeCanvas();                                         // initial size (viewport-based)
// Only flash the demo when there's no real feed. With ?id=/?game=, show an empty
// board until the first fetch lands so we jump straight to the live position
// instead of flashing the demo game first. loadedOnce stays false so the first
// poll's applyGame is treated as the initial load (jump to latest, no autoplay).
{
  const p = new URLSearchParams(location.search);
  if (p.has('id') || p.has('game')) render();         // empty board, no demo flash
  else applyGame(DEMO_GAME);                           // no feed → show demo
}
requestAnimationFrame(sizeCanvas);                    // and once more after first paint
poll();
</script>
</body>
</html>
